# Publishes the site to GitHub Pages.
#
# This site is plain HTML and CSS — there is nothing to compile — so this
# workflow simply uploads the files as they are. It runs automatically every
# time you push to the master branch.
#
# (It replaces the Jekyll workflow GitHub suggested, which tried to run
#  `bundle exec jekyll build` and would fail, because this site has no Gemfile.)

name: Deploy static site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload the whole repository
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
